name: guruproxy
description: GuruProxy v2.4 — app-focused mobile CDN-fronting client
publish_to: "none"
version: 2.4.3+243

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  window_manager: ^0.5.2
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/bin/
    - assets/ranges/
    - assets/presets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon.png
  adaptive_icon_background: "#0B2E2B"
  adaptive_icon_foreground: assets/brand/app-icon.png
  windows:
    generate: true
    image_path: assets/brand/app-icon.png
    icon_size: 256
